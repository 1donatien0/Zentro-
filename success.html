<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Order Success</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#312e81
);

height:100vh;

display:flex;
justify-content:center;
align-items:center;

color:white;
}

.success-card{

width:500px;

padding:40px;

text-align:center;

background:
rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

box-shadow:
0 20px 50px rgba(0,0,0,.3);
}

.success-icon{

font-size:70px;

margin-bottom:20px;
}

.order-id{

margin-top:15px;

color:#00c2ff;

font-weight:600;
}

.delivery{

margin-top:15px;

font-size:18px;
}

.home-btn{

display:inline-block;

margin-top:25px;

padding:12px 25px;

background:#00c2ff;

color:white;

text-decoration:none;

border-radius:12px;
}
.order-summary{

margin-top:25px;

padding:20px;

background:rgba(255,255,255,.05);

border-radius:15px;
}

.order-item{

padding:10px;

margin:8px 0;

background:rgba(255,255,255,.05);

border-radius:10px;
}

</style>


</head>

<body>

<div class="success-card">

<div class="success-icon">
🎉
</div>

<h1>
Order Placed Successfully!
</h1>
<p id="customer-message"></p>

<p>
Thank you for shopping with Zentro.
</p>

<div class="order-id" id="order-id">
Order ID:
</div>

<div class="delivery">
📦 Estimated Delivery:
24 June 2026
</div>
<div class="order-summary">

<h3>🛒 Order Summary</h3>

<div id="order-items">

Loading...

</div>

</div>

<a
href="home.html"
class="home-btn">

Continue Shopping

</a>

</div>
<script>

const orderId =
"ZT" + Math.floor(Math.random() * 100000);

document.getElementById("order-id")
.innerText =
"Order ID: " + orderId;

</script>
<script>

let customerName =
localStorage.getItem("customerName");

document.getElementById(
"customer-message"
).innerText =
"Thank you for shopping with us, " +
customerName +
" ❤️";

</script>
<script src="storage.js"></script>
<script>

let order = safeParseStorage("lastOrder");


let orderItems =
document.getElementById("order-items");

orderItems.innerHTML = "";

order.forEach(item => {

orderItems.innerHTML += `

<div class="order-item">

✅ ${item.name}
(${item.quantity})

</div>

`;

});

</script>
</body>

</html>
