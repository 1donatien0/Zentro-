<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="Built with love by the Zentro Community">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <radialGradient id="footerCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="footerViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00c2ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4" />
    </linearGradient>

    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="104" rx="16" />
    </clipPath>

    <style>
      .glowPulse { animation: pulse 4s ease-in-out infinite alternate; }
      @keyframes pulse {
        from { opacity: 0.72; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .glowPulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="1200" height="104" fill="url(#footerGrad)" />
    <circle class="glowPulse" cx="220" cy="90" r="180" fill="url(#footerCyan)" />
    <circle class="glowPulse" cx="980" cy="20" r="180" fill="url(#footerViolet)" />
    <rect x="0" y="0" width="1200" height="3" fill="url(#topLine)" />

    <text x="600" y="47" text-anchor="middle" fill="#ffffff" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.4">Built by the Zentro Open-Source Community</text>
    <text x="600" y="75" text-anchor="middle" fill="#00c2ff" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" letter-spacing="0.6">Dark Slate (#0f172a)  •  Royal Indigo (#312e81)  •  Electric Cyan (#00c2ff)</text>
  </g>
</svg>
