<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Zentro — India's Next Shopping Experience">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="78%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#00c2ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2b4d" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <linearGradient id="cyanStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00c2ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5" />
    </linearGradient>

    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="260" rx="22" />
    </clipPath>

    <style>
      .orb1 { animation: floatOrb1 7s ease-in-out infinite alternate; }
      .orb2 { animation: floatOrb2 9s ease-in-out infinite alternate; }
      .bot { animation: botFloat 4s ease-in-out infinite; }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      .p1 { animation: rise 11s linear infinite; }
      .p2 { animation: rise 14s linear infinite 2s; }
      .p3 { animation: rise 9s linear infinite 4s; }
      .p4 { animation: rise 13s linear infinite 1s; }
      .p5 { animation: rise 10s linear infinite 3s; }
      .titleGlow { animation: titlePulse 3.5s ease-in-out infinite alternate; }

      @keyframes floatOrb1 {
        from { transform: translate(0px, 0px); }
        to { transform: translate(36px, 24px); }
      }
      @keyframes floatOrb2 {
        from { transform: translate(0px, 0px); }
        to { transform: translate(-32px, -22px); }
      }
      @keyframes botFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes blink {
        0%, 45%, 51%, 100% { transform: scaleY(1); }
        48% { transform: scaleY(0.1); }
      }
      @keyframes rise {
        0% { transform: translateY(275px); opacity: 0; }
        15% { opacity: 0.65; }
        85% { opacity: 0.45; }
        100% { transform: translateY(-25px); opacity: 0; }
      }
      @keyframes titlePulse {
        from { opacity: 0.94; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb1, .orb2, .bot, .eye, .p1, .p2, .p3, .p4, .p5, .titleGlow { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Deep Zentro midnight navy to royal indigo background -->
    <rect x="0" y="0" width="1200" height="260" fill="url(#bgGrad)" />

    <!-- Ambient glowing orbs (matching checkout.html & index.html) -->
    <circle class="orb1" cx="200" cy="40" r="240" fill="url(#cyanOrb)" />
    <circle class="orb2" cx="1020" cy="220" r="260" fill="url(#violetOrb)" />

    <!-- Subtle futuristic dot accents -->
    <g fill="#00c2ff" opacity="0.22">
      <circle cx="52" cy="42" r="2.2" /><circle cx="72" cy="42" r="2.2" /><circle cx="92" cy="42" r="2.2" />
      <circle cx="52" cy="62" r="2.2" /><circle cx="72" cy="62" r="2.2" /><circle cx="92" cy="62" r="2.2" />
      <circle cx="52" cy="82" r="2.2" /><circle cx="72" cy="82" r="2.2" /><circle cx="92" cy="82" r="2.2" />

      <circle cx="1108" cy="178" r="2.2" /><circle cx="1128" cy="178" r="2.2" /><circle cx="1148" cy="178" r="2.2" />
      <circle cx="1108" cy="198" r="2.2" /><circle cx="1128" cy="198" r="2.2" /><circle cx="1148" cy="198" r="2.2" />
      <circle cx="1108" cy="218" r="2.2" /><circle cx="1128" cy="218" r="2.2" /><circle cx="1148" cy="218" r="2.2" />
    </g>

    <!-- Floating cyan particles -->
    <g fill="#00c2ff" filter="url(#cyanGlow)">
      <circle class="p1" cx="145" cy="0" r="3.5" />
      <circle class="p2" cx="340" cy="0" r="2.8" />
      <circle class="p3" cx="620" cy="0" r="3.2" />
      <circle class="p4" cx="890" cy="0" r="3.5" />
      <circle class="p5" cx="1065" cy="0" r="2.6" />
    </g>

    <!-- Subtle glassmorphic inner frame -->
    <rect x="210" y="34" width="780" height="192" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#00c2ff" stroke-opacity="0.22" stroke-width="1.2" />

    <!-- Animated Zentro Bot icon -->
    <g class="bot" transform="translate(275, 76)">
      <rect x="0" y="0" width="106" height="106" rx="26" fill="url(#botGrad)" stroke="#00c2ff" stroke-opacity="0.65" stroke-width="2.2" filter="url(#cyanGlow)" />
      <circle class="eye" cx="35" cy="42" r="9" fill="#00c2ff" filter="url(#cyanGlow)" />
      <circle class="eye" cx="71" cy="42" r="9" fill="#00c2ff" filter="url(#cyanGlow)" />
      <path d="M 35 70 Q 53 86 71 70" fill="none" stroke="#00c2ff" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />
    </g>

    <!-- Brand Typography -->
    <text class="titleGlow" x="420" y="122" fill="#ffffff" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" letter-spacing="1.5">Zentro</text>
    <text x="422" y="158" fill="#00c2ff" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" letter-spacing="0.4">India's Next Shopping Experience</text>

    <!-- Subtle dark glass pill -->
    <rect x="422" y="176" width="320" height="28" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#00c2ff" stroke-opacity="0.35" stroke-width="1" />
    <text x="582" y="195" text-anchor="middle" fill="#cbd5e1" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.8">HTML5  •  CSS3  •  VANILLA JAVASCRIPT</text>

    <!-- Bottom glowing border accent -->
    <rect x="0" y="256" width="1200" height="4" fill="url(#cyanStroke)" />
  </g>
</svg>
