name: Feature Request
description: Suggest a new feature or improvement for Zentro
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Zentro! Please check the [Planned Roadmap](https://github.com/Ayaan-20-11/Zentro-#planned-roadmap) and [existing issues](https://github.com/Ayaan-20-11/Zentro-/issues) before submitting.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A clear and concise description of the feature or improvement you want to propose.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem the Feature Solves
      description: Is your request related to a current limitation or usability gap in Zentro?
      placeholder: Currently, Zentro cannot...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working in Zentro.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative approaches or workarounds you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add mockups, references, or notes on whether you would like to help implement this.
    validations:
      required: false
